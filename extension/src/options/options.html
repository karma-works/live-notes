<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optTitle">Live Notes</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon.svg" alt="" width="32" height="32" />
        <h1 data-i18n="optTitle">Live Notes</h1>
      </header>
      <p class="hint" data-i18n="optIntro"></p>

      <form id="form" autocomplete="off">
        <label for="port" data-i18n="optPort">Port</label>
        <input id="port" name="port" type="number" min="1" max="65535" required />

        <label for="token" data-i18n="optToken">Token</label>
        <div class="row">
          <input id="token" name="token" type="password" spellcheck="false" />
          <button type="button" id="show" class="secondary" data-i18n="optShow">Show</button>
        </div>

        <div class="buttons">
          <button type="submit" id="save" data-i18n="optSave">Save</button>
          <button type="button" id="test" class="secondary" data-i18n="optTest">Test connection</button>
        </div>
      </form>

      <div id="perm" class="notice" hidden>
        <span data-i18n="optPermission"></span>
        <button type="button" id="grant" data-i18n="optPermissionGrant">Allow</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="hint" data-i18n="optShortcut"></p>
    </main>
    <script src="../lib/api.js"></script>
    <script src="options.js"></script>
  </body>
</html>
