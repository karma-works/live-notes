name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (build, test, lint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (screenshot tour)
        run: cargo clippy -p ln-app --features screenshots -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: cargo deny
        run: |
          brew install cargo-deny
          cargo deny check

  linux:
    name: Linux (UI-free crates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Tests of platform-independent crates
        run: cargo test -p ln-types -p ln-notes -p ln-index -p ln-ai -p ln-models
