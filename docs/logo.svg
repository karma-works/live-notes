<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Live Notes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2433"/>
      <stop offset="1" stop-color="#0B0F18"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8B26A"/>
      <stop offset="1" stop-color="#F06A4E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Speech: sound bars on the left … -->
  <g fill="url(#wave)">
    <rect x="92" y="214" width="26" height="84" rx="13"/>
    <rect x="134" y="166" width="26" height="180" rx="13"/>
    <rect x="176" y="126" width="26" height="260" rx="13"/>
    <rect x="218" y="186" width="26" height="140" rx="13"/>
  </g>
  <!-- … become lines of a note on the right. -->
  <g fill="#F4F1EA">
    <rect x="270" y="168" width="150" height="26" rx="13"/>
    <rect x="270" y="243" width="118" height="26" rx="13"/>
    <rect x="270" y="318" width="136" height="26" rx="13" opacity="0.55"/>
  </g>
  <!-- Recording. -->
  <circle cx="404" cy="108" r="22" fill="#F06A4E"/>
</svg>
